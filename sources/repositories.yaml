schema_version: 0.1.0
# Every merged capability is pinned to an immutable default-branch commit (state: pinned); refresh.py --remote
# verifies that the commit resolves and captures the manifest from it. pending_pr entries point at an unmerged
# pull-request head and are re-pinned when that PR is merged.
#
# Graduation is decided here, never in a repository's own aipe.yaml. `stage: graduated` requires the repository to
# live under https://github.com/AIPE-Labs/ and `release` to name the version tag whose commit is `ref`; refresh.py
# verifies the tag. A record without `stage` is incubating. See docs/graduation.md.
#
# AIPE-Design-Agent was renamed AIPE-Electrical-Design (id aipe.electrical-design; the id aipe.design-agent is retired)
# and HeatSinkOptimisation became AIPE-Thermal-Design (2026-10-21).
# AIPE-Sketch was renamed AIPE-Sketcher (v0.2.0); the stable capability id aipe.sketch is unchanged.
repositories:
  - {id: aipe.core, repository: 'https://github.com/AIPE-Labs/AIPE-Core', ref: a8481c60ddfdced685067227fb16ca534be3eb5b, state: pinned, path: aipe.yaml, stage: graduated, release: v0.1.0}
